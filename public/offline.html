<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1018" />
    <title>BAUS Training — нет сети</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 0%, rgba(101,214,181,.14), transparent 28rem), #0b1018; color: #f4f7fb; font-family: Arial, sans-serif; }
      main { width: min(460px, 100%); padding: 28px; border: 1px solid #26364a; border-radius: 24px; background: #121a26; text-align: center; }
      .mark { display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto 20px; border: 3px solid #65d6b5; border-radius: 22px; color: #65d6b5; font-size: 15px; font-weight: 900; }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0 0 22px; color: #9aabc0; line-height: 1.5; }
      button { border: 0; border-radius: 14px; padding: 13px 18px; background: #65d6b5; color: #062219; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">BAUS</div>
      <h1>Нет подключения к интернету</h1>
      <p>История и планы защищённо хранятся в облаке. Подключись к сети и попробуй снова.</p>
      <button type="button" onclick="window.location.reload()">Повторить</button>
    </main>
  </body>
</html>
